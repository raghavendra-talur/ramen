---
apiVersion: ramendr.openshift.io/v1alpha1
kind: RamenConfig
health:
  healthProbeBindAddress: :8081
metrics:
  bindAddress: 127.0.0.1:9289
webhook:
  port: 9443
leaderElection:
  # leaderElect: true // enable during in cluster execution
  leaderElect: false
  resourceName: hub.ramendr.openshift.io
# Note: Controller type is now configured via RAMEN_CONTROLLER_TYPE environment variable
# Set RAMEN_CONTROLLER_TYPE=dr-hub when running this config
maxConcurrentReconciles: 50
