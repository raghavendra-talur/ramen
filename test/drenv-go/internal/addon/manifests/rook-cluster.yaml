# Code generated by `make render` from rook/cluster (kustomize build). DO NOT EDIT.
# Re-run `make render` to refresh the pinned upstream snapshot.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-mgr
  namespace: rook-ceph
spec:
  name: .mgr
  replicated:
    requireSafeReplicaSize: false
    size: 1
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: my-cluster
  namespace: rook-ceph
spec:
  cephConfig:
    global:
      bdev_flock_retry: "20"
      bluefs_buffered_io: "false"
      mon_data_avail_warn: "10"
      mon_warn_on_pool_no_redundancy: "false"
      osd_pool_default_size: "1"
  cephVersion:
    allowUnsupported: true
    image: ghcr.io/nikhil-ladha/rbd-group-mirroring:latest
  crashCollector:
    disable: true
  dashboard:
    enabled: true
  dataDirHostPath: /data/rook
  disruptionManagement:
    managePodBudgets: true
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
        timeout: 600s
    muteHealthWarning:
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
      AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
        policy: mute
  logCollector:
    enabled: true
    maxLogSize: 50M
    periodicity: daily
  mgr:
    allowMultiplePerNode: true
    count: 1
    modules:
    - enabled: false
      name: rook
  mon:
    allowMultiplePerNode: true
    count: 1
  monitoring:
    enabled: false
  network:
    provider: host
  priorityClassNames:
    all: system-node-critical
    mgr: system-cluster-critical
  security:
    cephx:
      csi:
        keyType: aes
  skipUpgradeChecks: true
  storage:
    allowDeviceClassUpdate: true
    allowOsdCrushWeightUpdate: false
    useAllDevices: true
    useAllNodes: true
