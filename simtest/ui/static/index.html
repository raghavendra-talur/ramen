<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>simtest</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background:#0b0e14; color:#e6edf3; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
         padding:10px; display:grid; grid-template-rows:auto 1fr; gap:10px; }
  .panel { background:#11151ccc; border:1px solid #2a3140; border-radius:6px; padding:12px; }
  h4 { font-size:10px; letter-spacing:1.5px; color:#7d8590; margin-bottom:6px; font-weight:600; }
  .kv { display:flex; justify-content:space-between; gap:10px; font-size:12px; }
  .kv b { font-weight:600; text-align:right; }
  .ok { color:#2ea043; } .bad { color:#f85149; } .warn { color:#d29922; } .run { color:#58a6ff; }
  .muted { color:#7d8590; }

  /* header strip: the run at a glance, plus loud chips for anything hurting */
  #run { display:flex; align-items:center; gap:16px; padding:9px 14px; }
  #run .name { font-weight:700; letter-spacing:1px; }
  #run .bar { flex:1; max-width:420px; height:8px; background:#21262d; border-radius:4px; overflow:hidden; }
  #run .bar div { height:100%; background:#58a6ff; transition:width .3s; }
  .chip { font-size:11px; padding:1px 8px; border-radius:9px; background:#2d0f0f; color:#f85149; border:1px solid #f8514966; }
  #run .cmd { font-size:11px; color:#7d8590; background:#0e1117; border:1px solid #2a3140; border-radius:5px;
              padding:2px 9px; max-width:520px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .cols { display:flex; gap:10px; min-height:0; }
  #tests { width:250px; flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  #tests .rows { overflow-y:auto; flex:1; }
  .tgroup { font-size:9px; letter-spacing:1px; color:#7d8590; margin:8px 0 3px; text-transform:uppercase; }
  .trow { display:flex; gap:7px; align-items:center; padding:3px 5px; border-radius:4px; cursor:pointer; font-size:12px; }
  .trow:hover { background:#1c2431; }
  .trow.pinned { outline:1px solid #58a6ff55; background:#151d2a; }
  .trow .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .trow .id { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trow .why { color:#7d8590; font-size:10px; flex-shrink:0; }
  .d-passed { background:#2ea043; } .d-failed { background:#f85149; }
  .d-running { border:2px solid #58a6ff; border-top-color:transparent; background:none; animation:spin 1s linear infinite; }
  .d-queued { border:1.5px solid #30363d; background:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #centercol { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  #tabbar { display:flex; gap:6px; }
  #tabbar button { font:inherit; font-size:10px; letter-spacing:1.5px; font-weight:600; cursor:pointer;
                   color:#7d8590; background:#11151ccc; border:1px solid #2a3140; border-radius:6px 6px 0 0;
                   padding:5px 16px 4px; border-bottom:none; }
  #tabbar button.active { color:#e6edf3; background:#1c2431; border-color:#58a6ff66; }
  #vizwrap { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
  #eventsview { flex:1; min-height:0; display:none; flex-direction:column; }
  #logsview { flex:1; min-height:0; display:none; flex-direction:column; }
  #logbar { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  #logbar .src, #logbar .lvl { font:inherit; font-size:10px; letter-spacing:1px; cursor:pointer;
    color:#7d8590; background:#0e1117; border:1px solid #2a3140; border-radius:5px; padding:2px 10px; }
  #logbar .src.active { color:#e6edf3; background:#1c2431; border-color:#58a6ff66; }
  #logbar .lvl.active { color:#e6edf3; border-color:#58a6ff66; }
  #logbar input { font:inherit; font-size:11px; color:#e6edf3; background:#0e1117;
    border:1px solid #2a3140; border-radius:5px; padding:2px 9px; flex:1; min-width:120px; }
  #logs { overflow:auto; flex:1; font-size:11px; line-height:1.6; }
  .lrow { display:grid; grid-template-columns:66px 44px 90px minmax(200px,1.4fr) 1fr; gap:8px;
    border-bottom:1px solid #12161f; padding:1px 0; align-items:baseline; }
  .lrow > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lt { color:#57606a; }
  .lrow .ll { font-weight:700; }
  .ll.INFO { color:#58a6ff; } .ll.ERROR { color:#f85149; } .ll.DEBUG { color:#57606a; }
  .ll.WARN { color:#d29922; } .ll.FATAL, .ll.PANIC { color:#f85149; }
  .lrow .lg { color:#a371f7; }
  .lrow .lj { color:#57606a; }
  .lraw { color:#7d8590; border-bottom:1px solid #12161f; padding:1px 0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stagewrap { flex:1; min-height:0; display:flex; }
  #stage { flex:1; position:relative; min-height:0; max-width:980px; max-height:620px; width:100%; margin:0 auto; }
  #edges { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #edges line { stroke:#2a3140; stroke-width:2; }
  #edges line.sev { stroke:#f85149; stroke-dasharray:6 6; animation:march 1s linear infinite; }
  #edges line.rep { stroke:#2ea043; stroke-width:2.5; stroke-dasharray:9 7; animation:march 1.2s linear infinite; }
  #edges line.rep.sev { stroke:#f85149; }
  #edges line.spotedge { stroke:#8957e5; stroke-width:3; animation:march .7s linear infinite; }
  @keyframes march { to { stroke-dashoffset:-32; } }
  .dot2 { position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:3; }
  .glyphs { display:flex; gap:6px; margin-top:7px; }
  .glyph { font-size:9px; color:#57606a; border:1px solid #2a3140; border-radius:4px; padding:0 4px; transition:all .15s; }
  .glyph.on { color:#0b0e14; background:#58a6ff; border-color:#58a6ff; }
  .glyph.faulted { color:#f85149; border-color:#f85149; }
  .cluster.spot { border-color:#8957e5; box-shadow:0 0 14px #8957e566; animation:spotpulse 1.4s ease-in-out infinite; }
  #s3.spot { border-color:#8957e5; box-shadow:0 0 14px #8957e566; animation:spotpulse 1.4s ease-in-out infinite; }
  @keyframes spotpulse { 50% { box-shadow:0 0 26px #8957e5aa; } }
  .spottag { font-size:10px; color:#8957e5; margin-top:5px; }
  .cluster { position:absolute; width:240px; background:#141a23; border:1.5px solid #3d4657; border-radius:9px; padding:11px 13px; }
  .cluster.dead { border-color:#f85149; }
  .cluster .name { font-size:14px; font-weight:700; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
  .cluster .led { width:8px; height:8px; border-radius:50%; background:#2ea043; box-shadow:0 0 6px #2ea04388; margin-left:auto; }
  .cluster.dead .led { background:#f85149; box-shadow:0 0 8px #f85149; animation:blink 1s infinite; }
  .cluster .sub { font-size:11px; color:#7d8590; }
  .badges { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .badge { font-size:10px; padding:0 7px; border-radius:8px; background:#2d0f0f; color:#f85149; border:1px solid #f8514666; }
  .pvcs { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .pvc { width:15px; height:15px; border-radius:3px; background:#21262d; border:1px solid #30363d; transition:background .6s, box-shadow .6s; }
  .pvc.Bound { background:#2ea043; border:none; box-shadow:0 0 5px #2ea04366; }
  .pvc.Pending, .pvc.Lost { background:#f85149; border:none; box-shadow:0 0 8px #f8514999; }
  #s3 { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); width:110px; text-align:center; background:#11251c; border:1.5px dashed #2ea043; border-radius:9px; padding:8px; font-size:12px; }
  #s3.down { background:#2d0f0f; border-color:#f85149; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.55; } }

  #inspector { width:310px; flex-shrink:0; overflow-y:auto; }
  #events { overflow-y:auto; flex:1; font-size:12px; line-height:1.75; color:#7d8590; }
  #events > div { padding:1px 0 1px 14px; text-indent:-14px; border-bottom:1px solid #161b24; }
  #events .t { color:#57606a; }
  #events .actor { color:#58a6ff; }
  #events .viol { color:#f85149; }

  #timeline { flex-shrink:0; }
  .tlrow { display:flex; align-items:center; margin-bottom:5px; }
  .tllabel { width:130px; font-size:11px; color:#7d8590; flex-shrink:0; }
  .tlband { flex:1; display:flex; height:18px; border-radius:3px; overflow:hidden; background:#0e1117; position:relative; }
  .tlband.flags { overflow:visible; background:none; }
  .seg { height:100%; position:absolute; top:0; }
  .seg span { position:absolute; left:4px; top:2px; font-size:10px; color:#fffb; overflow:hidden; white-space:nowrap; max-width:95%; }
  .flag { position:absolute; top:-2px; color:#f85149; font-size:13px; cursor:default; }
  .axis { display:flex; justify-content:space-between; font-size:10px; color:#57606a; margin-left:130px; margin-top:2px; }
</style>
</head>
<body>
<div class="panel" id="run"></div>
<div class="cols">
  <div class="panel" id="tests"><h4>TESTS</h4><div class="rows"></div></div>
  <div id="centercol">
    <div id="tabbar">
      <button data-tab="stage" class="active">STAGE</button>
      <button data-tab="events">EVENTS</button>
      <button data-tab="logs">LOGS</button>
    </div>
    <div id="vizwrap">
      <div id="stagewrap"><div id="stage">
        <svg id="edges"></svg>
        <div class="cluster" id="c-hub" style="left:50%;top:2%;transform:translateX(-50%)"></div>
        <div class="cluster" id="c-dr1" style="left:3%;bottom:3%"></div>
        <div class="cluster" id="c-dr2" style="right:3%;bottom:3%"></div>
        <div id="s3">S3</div>
      </div></div>
      <div class="panel" id="timeline"></div>
    </div>
    <div class="panel" id="eventsview"><h4>EVENTS</h4><div id="events"></div></div>
    <div class="panel" id="logsview">
      <div id="logbar">
        <button class="src" data-src="hub">HUB</button>
        <button class="src" data-src="dr1">DR1</button>
        <button class="src" data-src="dr2">DR2</button>
        <button class="src" data-src="actors">ACTORS</button>
        <button class="lvl active" id="logscope">⧉ SCENARIO</button>
        <span class="muted" id="logscopeid" style="font-size:10px"></span>
        <button class="lvl" data-lvl="ERROR">ERROR</button>
        <button class="lvl" data-lvl="INFO">INFO</button>
        <button class="lvl" data-lvl="DEBUG">DEBUG</button>
        <input id="logfilter" placeholder="filter (substring, any field)">
      </div>
      <div id="logs"></div>
    </div>
  </div>
  <div class="panel" id="inspector"></div>
</div>

<script>
"use strict";
const S = { snap: null, pinned: null, tab: "stage",
  logSrc: "hub", logLevels: { ERROR: true, INFO: true, DEBUG: false }, logFilter: "", logLines: [],
  logScope: true }; // true = align logs to the selected scenario's time window

// Known DR states and progressions keep fixed, meaningful colors: green for
// healthy/steady, blue for the secondary/ready side, purple for in-flight
// action phases, amber for cleanup, red strictly for trouble. Unknown values
// fall back to a deterministic hash so a value keeps its color across
// reloads instead of depending on observation order.
const SEMANTIC = {
  "primary": "#2ea043", "secondary": "#58a6ff",
  "Deployed": "#2ea043", "Completed": "#2ea043", "up": "#2ea043",
  "FailingOver": "#a371f7", "Relocating": "#a371f7", "Initiating": "#d29922",
  "FailedOver": "#1f6feb", "Relocated": "#39c5cf",
  "Deploying": "#58a6ff", "WaitForReadiness": "#8957e5",
  "WaitingForResourceRestore": "#6e40c9", "WaitForFencing": "#6e40c9",
  "Cleaning Up": "#d29922", "WaitOnUserToCleanUp": "#bb8009",
  "Deleting": "#f85149", "down": "#f85149", "Paused": "#f85149",
};
const PALETTE = ["#2ea043","#58a6ff","#a371f7","#d29922","#8957e5","#1f6feb","#6e40c9","#39c5cf"];
function colorOf(v) {
  if (!v) return "#21262d";
  if (SEMANTIC[v]) return SEMANTIC[v];
  let h = 0;
  for (let i = 0; i < v.length; i++) h = (h * 31 + v.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = t => t ? new Date(t).toTimeString().slice(0, 8) : "";
const dur = ms => ms >= 60000 ? `${Math.floor(ms/60000)}m${Math.floor(ms%60000/1000)}s` : `${Math.floor(ms/1000)}s`;

async function refetch() {
  S.snap = await (await fetch("/api/snapshot")).json();
  render();
}

function connect() {
  const es = new EventSource("/api/stream");
  es.onopen = () => scheduleRefetch();  // resync snapshot on (re)connect
  es.onmessage = () => {};       // typed events only
  ["run_started","test_started","test_finished","state_changed","actor_event",
   "fault_changed","manager_changed","invariant_violated"].forEach(t =>
    es.addEventListener(t, () => scheduleRefetch()));
  es.onerror = () => {};         // EventSource auto-reconnects
}

// Events arrive in bursts; coalesce into at most ~5 snapshot fetches/sec.
let fetchTimer = null;
function scheduleRefetch() {
  if (fetchTimer) return;
  fetchTimer = setTimeout(() => { fetchTimer = null; refetch(); }, 200);
}

// A running scenario keeps its elapsed clock and open timeline moving even
// between events (quiet waits are exactly when you stare at the page).
setInterval(() => { if (S.snap && S.snap.current) render(); }, 1000);

function scenario() {
  if (!S.snap) return null;
  return S.pinned || S.snap.current || lastFinished();
}
function lastFinished() {
  const t = (S.snap.tests || []).filter(t => t.finishedAt);
  return t.length ? t[t.length - 1].id : null;
}

// Full re-renders replace scroll containers; keep the user's place in them.
function keepScroll(el, fn) {
  const top = el.scrollTop;
  fn();
  el.scrollTop = top;
}

function render() {
  const s = S.snap; if (!s) return;
  renderRun(s); renderTests(s); renderInspector(s); renderEvents(s);
  // The stage's geometry reads as zero while its tab is hidden; skip its
  // renderers there (the events tab replaces the whole visualization).
  if (S.tab === "stage") { renderStage(s); renderTimeline(s); animateTraffic(s); }
  else { S.animSeq = Math.max(S.animSeq ?? 0, s.seq || 0); } // don't replay on return
}

function applyTab() {
  document.getElementById("vizwrap").style.display = S.tab === "stage" ? "flex" : "none";
  document.getElementById("eventsview").style.display = S.tab === "events" ? "flex" : "none";
  document.getElementById("logsview").style.display = S.tab === "logs" ? "flex" : "none";
  document.querySelectorAll("#tabbar button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === S.tab));
  if (S.tab === "logs") fetchLogs();
}

// ---- logs tab: the ramen manager logs, parsed the ramen-log-analyzer way:
// tab-separated zap console fields (time, LEVEL, logger, file:line,
// message, details JSON) rendered as columns, filtered by level/substring.
// scenarioWindow: the framework runs the tests itself, so the selected
// scenario's start/finish timestamps align exactly with the log clocks.
function scenarioWindow() {
  if (!S.logScope || !S.snap) return null;
  const id = scenario();
  const t = (S.snap.tests || []).find(t => t.id === id);
  if (!t || !t.startedAt) return null;
  return { id, since: t.startedAt, until: t.finishedAt || new Date().toISOString() };
}

async function fetchLogs() {
  const win = scenarioWindow();
  const scopeEl = document.getElementById("logscopeid");
  scopeEl.textContent = win ? win.id : (S.logScope ? "(no scenario)" : "full tail");
  let q = `/api/logs?src=${S.logSrc}&tail=600`;
  if (win) q += `&since=${encodeURIComponent(win.since)}&until=${encodeURIComponent(win.until)}`;
  try {
    const r = await fetch(q);
    if (!r.ok) { S.logLines = [`(no ${S.logSrc}.log yet)`]; renderLogs(); return; }
    S.logLines = (await r.text()).split("\n").filter(Boolean);
  } catch { S.logLines = []; }
  renderLogs();
}
document.getElementById("logscope").onclick = () => {
  S.logScope = !S.logScope;
  document.getElementById("logscope").classList.toggle("active", S.logScope);
  fetchLogs();
};
setInterval(() => { if (S.tab === "logs") fetchLogs(); }, 2000);

function parseLogLine(line) {
  const parts = line.split("\t");
  if (parts.length < 4 || !/^(TRACE|DEBUG|INFO|WARN|ERROR|FATAL|PANIC)$/.test(parts[1])) return null;
  const [ts, level, logger, filepos] = parts;
  let msg = parts[4] || "", json = parts.slice(5).join(" ");
  if (!json && /^\{.*\}$/.test(msg)) { json = msg; msg = ""; }
  return { ts, level, logger, filepos, msg, json };
}

function renderLogs() {
  const el = document.getElementById("logs");
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  const filt = S.logFilter.toLowerCase();
  let html = "";
  for (const line of S.logLines) {
    if (filt && !line.toLowerCase().includes(filt)) continue;
    const p = parseLogLine(line);
    if (!p) { // stack traces, actors.log, anything non-zap: raw row
      if (S.logLevels.DEBUG || !filt || line.toLowerCase().includes(filt))
        html += `<div class="lraw" title="${esc(line)}">${esc(line)}</div>`;
      continue;
    }
    const lvlKey = p.level === "WARN" || p.level === "FATAL" || p.level === "PANIC" ? "ERROR" : p.level;
    if (S.logLevels[lvlKey] === false) continue;
    html += `<div class="lrow">
      <span class="lt" title="${esc(p.ts)}">${esc(p.ts.slice(11, 19))}</span>
      <span class="ll ${esc(p.level)}">${esc(p.level)}</span>
      <span class="lg" title="${esc(p.logger)}">${esc(p.logger)}</span>
      <span title="${esc(p.filepos)}\n${esc(p.msg)}">${esc(p.msg)}</span>
      <span class="lj" title="${esc(p.json)}">${esc(p.json)}</span></div>`;
  }
  el.innerHTML = html || `<div class="muted">no matching lines</div>`;
  if (stick) el.scrollTop = el.scrollHeight;
}

document.querySelectorAll("#logbar .src").forEach(b =>
  b.onclick = () => { S.logSrc = b.dataset.src; syncLogBar(); fetchLogs(); });
document.querySelectorAll("#logbar .lvl").forEach(b =>
  b.onclick = () => { S.logLevels[b.dataset.lvl] = !S.logLevels[b.dataset.lvl]; syncLogBar(); renderLogs(); });
document.getElementById("logfilter").oninput = e => { S.logFilter = e.target.value; renderLogs(); };
function syncLogBar() {
  document.querySelectorAll("#logbar .src").forEach(b =>
    b.classList.toggle("active", b.dataset.src === S.logSrc));
  document.querySelectorAll("#logbar .lvl").forEach(b =>
    b.classList.toggle("active", S.logLevels[b.dataset.lvl] !== false));
}
syncLogBar();
document.querySelectorAll("#tabbar button").forEach(b =>
  b.onclick = () => { S.tab = b.dataset.tab; applyTab(); render(); });

// "actors.Silent" reads like a stack trace; "silent" reads like a fault.
const policyName = d => String(d || "").replace(/^actors\./, "").toLowerCase();

function renderRun(s) {
  const total = (s.tests || []).length;
  const done = (s.run.passed || 0) + (s.run.failed || 0);
  const chips = (s.faults || []).filter(f => f.active)
    .map(f => `<span class="chip">${esc(f.key)} ${esc(policyName(f.desc).replace(/^s3 /, ""))}</span>`).join(" ");
  const deadMgrs = Object.entries(s.managers || {}).filter(([, alive]) => !alive)
    .map(([n]) => `<span class="chip">mgr ${esc(n)} DEAD</span>`).join(" ");
  document.getElementById("run").innerHTML = `
    <span class="name">SIMTEST · ${esc(s.run.name || "run")}</span>
    ${s.run.command ? `<span class="cmd" title="${esc(s.run.command)}">${esc(s.run.command)}</span>` : ""}
    <div class="bar"><div style="width:${total ? 100 * done / total : 0}%"></div></div>
    <span>${done}/${total}</span>
    <span><span class="ok">${s.run.passed || 0}✓</span>
      <span class="bad">${s.run.failed || 0}✗</span>
      <span class="warn">${s.run.violations || 0}⚑</span></span>
    ${chips}${deadMgrs}
    <span class="muted" style="margin-left:auto">${s.run.startedAt ? dur(Date.now() - Date.parse(s.run.startedAt)) : ""}</span>`;
}

// splitID turns "failover/at=wrr/fault=s3-down" into a group header
// ("failover · at wrr") and a short row label ("s3-down"); ungrouped ids
// (the baselines) fall under "baseline".
function splitID(id) {
  const parts = id.split("/");
  if (parts.length === 1) return { group: "baseline", label: id };
  const label = parts[parts.length - 1].replace(/^fault=/, "");
  return { group: parts.slice(0, -1).join(" · ").replace(/at=/, "at "), label };
}

function renderTests(s) {
  const rows = document.querySelector("#tests .rows");
  keepScroll(rows, () => {
    let lastGroup = null, html = "";
    for (const t of (s.tests || [])) {
      const { group, label } = splitID(t.id);
      if (group !== lastGroup) { html += `<div class="tgroup">${esc(group)}</div>`; lastGroup = group; }
      let extra = "";
      if (t.status === "failed") extra = esc(t.reason);
      else if (t.status === "running" && t.startedAt) extra = dur(Date.now() - Date.parse(t.startedAt));
      else if (t.finishedAt && t.startedAt) extra = dur(Date.parse(t.finishedAt) - Date.parse(t.startedAt));
      const pin = scenario() === t.id ? " pinned" : "";
      html += `<div class="trow${pin}" data-id="${esc(t.id)}" title="${esc(t.id)}">
        <span class="dot d-${t.status}"></span>
        <span class="id">${esc(label)}</span><span class="why">${extra}</span></div>`;
    }
    rows.innerHTML = html;
  });
  rows.querySelectorAll(".trow").forEach(el =>
    el.onclick = () => {
      S.pinned = S.pinned === el.dataset.id ? null : el.dataset.id;
      render();
      if (S.tab === "logs") fetchLogs(); // re-align the log window immediately
    });
}

function objectsFor(s, cluster, kind) {
  return (s.objects || []).filter(o => o.cluster === cluster && o.kind === kind);
}

function stagePoints() {
  const stage = document.getElementById("stage");
  const r = stage.getBoundingClientRect();
  const box = id => {
    const b = document.getElementById(id).getBoundingClientRect();
    return { x: b.left - r.left + b.width / 2, y: b.top - r.top + b.height / 2 };
  };
  return { r, hub: box("c-hub"), dr1: box("c-dr1"), dr2: box("c-dr2"), s3: box("s3") };
}

function drawEdges(st) {
  st = st || {};
  const svg = document.getElementById("edges");
  const { r, hub, dr1, dr2, s3 } = stagePoints();
  svg.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);

  const line = (a, b, cls) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"${cls ? ` class="${cls}"` : ""}/>`;

  // Replication arrow: drawn primary -> secondary when the direction is
  // known, marching dashes showing flow; red while a volrep fault is set.
  let rep = "";
  const v = st.vrg || {};
  if (v.dr1 || v.dr2) {
    const from = v.dr2 === "primary" ? dr2 : dr1;
    const to = from === dr1 ? dr2 : dr1;
    const cls = "rep" + (st.repCut ? " sev" : "") + (st.repSpot ? " spotedge" : "");
    rep = line({ x: from.x, y: from.y + 14 }, { x: to.x, y: to.y + 14 }, cls)
      + `<polygon points="${to.x},${to.y + 14} ${to.x + (from.x < to.x ? -9 : 9)},${to.y + 9} ${to.x + (from.x < to.x ? -9 : 9)},${to.y + 19}"
           fill="${st.repCut ? "#f85149" : "#2ea043"}"/>`;
  }

  svg.innerHTML =
    line(hub, dr1, st.sevDr1 ? "sev" : "") +
    line(hub, dr2, st.sevDr2 ? "sev" : "") +
    line(dr1, s3) + line(dr2, s3) + rep;
}

// Faults live on the component they break: policy-store keys are
// "actor@cluster", so each cluster card wears its own active faults.
function badgesFor(s, cluster) {
  return (s.faults || [])
    .filter(f => f.active && f.key.endsWith("@" + cluster))
    .map(f => `<span class="badge">${esc(f.key.split("@")[0])} ${esc(policyName(f.desc))}</span>`).join("");
}

function clusterCard(s, id, title, body, badges, extraClass, tail) {
  const alive = (s.managers || {})[id] !== false;
  const el = document.getElementById("c-" + id);
  el.className = "cluster" + (alive ? "" : " dead") + (extraClass || "");
  el.innerHTML = `<div class="name">${title}<span class="led" title="manager ${alive ? "running" : "DEAD"}"></span></div>`
    + (alive ? "" : `<div class="sub bad">manager DEAD — see ${esc(id)}.log</div>`)
    + body + (badges ? `<div class="badges">${badges}</div>` : "") + (tail || "");
}

// Per-cluster actor glyphs: the simulated machinery, flashing as it acts
// and turning red while a fault policy is set against it.
const ACTORS = ["work", "view", "volrep", "volsync", "snap", "binder", "janitor"];
function glyphStrip(s, cluster) {
  return `<div class="glyphs">` + ACTORS.map(a => {
    const f = (s.faults || []).find(f => f.active && f.key === a + "@" + cluster);
    return `<span class="glyph${f ? " faulted" : ""}" id="g-${a}-${cluster}"
      title="${a}@${cluster}${f ? " — " + esc(policyName(f.desc)) : ""}">${a.slice(0, 4)}</span>`;
  }).join("") + `</div>`;
}

// The waiting-on spotlight: map the selected DRPC's Wait* progression to the
// component the reconciler is actually blocked on.
function spotlightFor(drpc) {
  if (!drpc) return {};
  const f = drpc.fields, act = f.action;
  const target = act === "Failover" ? f.failoverCluster : f.preferredCluster;
  const otherOf = c => (c === "dr1" ? "dr2" : "dr1");
  if (!target) return {};
  switch (f.progression) {
    case "Deploying":
    case "WaitingForResourceRestore": return { cluster: target, why: "waiting: resource restore" };
    case "WaitForReadiness": return { cluster: target, why: "waiting: readiness" };
    case "Cleaning Up":
    case "WaitOnUserToCleanUp": return { cluster: otherOf(target), why: "waiting: cleanup" };
    case "WaitForFencing": return { cluster: otherOf(target), why: "waiting: fencing" };
    case "PreparingFinalSync": return { rep: true, why: "final sync" };
  }
  return {};
}

function renderStage(s) {
  const drpc = objectsFor(s, "hub", "DRPlacementControl")[0];
  const spot = spotlightFor(drpc);

  clusterCard(s, "hub", `<span class="run">HUB</span>`, drpc ? `
    <div class="sub">${esc(drpc.namespace)}/${esc(drpc.name)}</div>
    <div class="sub">phase <b style="color:${colorOf(drpc.fields.phase)}">${esc(drpc.fields.phase)}</b></div>
    <div class="sub">progression ${esc(drpc.fields.progression)}</div>` : `<div class="sub">no DRPC</div>`,
    badgesFor(s, "hub"));

  const vrgState = {};
  for (const c of ["dr1", "dr2"]) {
    const vrg = objectsFor(s, c, "VolumeReplicationGroup")[0];
    vrgState[c] = vrg ? vrg.fields.state : "";
    const pvcs = objectsFor(s, c, "PersistentVolumeClaim");
    const spotted = spot.cluster === c;
    clusterCard(s, c, c.toUpperCase(), `
      <div class="sub">VRG: ${vrg ? `<b style="color:${colorOf(vrg.fields.state)}">${esc(vrg.fields.state)}</b>` : "—"}</div>
      <div class="pvcs">${pvcs.map(p =>
        `<div class="pvc ${esc(p.fields.phase)}" title="${esc(p.namespace)}/${esc(p.name)}"></div>`).join("")}</div>`,
      badgesFor(s, c), spotted ? " spot" : "",
      glyphStrip(s, c) + (spotted ? `<div class="spottag">◈ ${esc(spot.why)}</div>` : ""));
  }

  const s3fault = (s.faults || []).find(f => f.key === "s3");
  document.getElementById("s3").className = s3fault && s3fault.active ? "down" : "";
  document.getElementById("s3").textContent = s3fault && s3fault.active ? "S3 · OUTAGE" : "S3";

  // Faults sever the link they actually break: view/work faults cut the
  // hub<->cluster edge, volrep faults cut the replication arrow.
  const cut = c => (s.faults || []).some(f =>
    f.active && (f.key === "view@" + c || f.key === "work@" + c));
  const repCut = (s.faults || []).some(f =>
    f.active && f.key.startsWith("volrep@"));

  drawEdges({
    sevDr1: cut("dr1"), sevDr2: cut("dr2"), repCut,
    vrg: vrgState, repSpot: !!spot.rep,
  });
}

function renderInspector(s) {
  const id = scenario();
  const test = (s.tests || []).find(t => t.id === id);
  const drpc = objectsFor(s, "hub", "DRPlacementControl")[0];
  const conds = drpc ? Object.entries(drpc.fields)
    .filter(([k]) => k.startsWith("cond-"))
    .map(([k, v]) => `<div class="kv"><span>${esc(k.slice(5))}</span>
      <b class="${v === "True" ? "ok" : "bad"}">${esc(v)}</b></div>`).join("") : "";
  const vrgs = ["dr1", "dr2"].map(c => {
    const v = objectsFor(s, c, "VolumeReplicationGroup")[0];
    return `<div class="kv"><span>vrg ${c}</span><b style="color:${colorOf(v && v.fields.state)}">${v ? esc(v.fields.state) : "—"}</b></div>`;
  }).join("");
  let lifecycle = "";
  if (test && test.startedAt) {
    const end = test.finishedAt ? Date.parse(test.finishedAt) : Date.now();
    lifecycle = `<div class="kv"><span>${test.status}</span><b>${dur(end - Date.parse(test.startedAt))}</b></div>`;
  }
  document.getElementById("inspector").innerHTML = `
    <h4>SELECTED · ${esc(id || "—")}</h4>${lifecycle}` + (drpc ? `
    <div class="kv"><span>phase</span><b style="color:${colorOf(drpc.fields.phase)}">${esc(drpc.fields.phase)}</b></div>
    <div class="kv"><span>progression</span><b>${esc(drpc.fields.progression)}</b></div>
    <h4 style="margin-top:10px">CONDITIONS</h4>${conds}
    <h4 style="margin-top:10px">VRGS</h4>${vrgs}` : `<div class="sub muted">no DRPC observed</div>`);
}

function renderTimeline(s) {
  const id = scenario();
  const tl = id && s.timelines ? s.timelines[id] : null;
  const el = document.getElementById("timeline");
  if (!tl) { el.innerHTML = `<h4>STATE TIMELINE</h4><div class="muted">no scenario selected</div>`; return; }

  let t0 = Infinity, t1 = -Infinity;
  for (const segs of Object.values(tl)) for (const g of segs) {
    t0 = Math.min(t0, Date.parse(g.start));
    t1 = Math.max(t1, Date.parse(g.end || new Date().toISOString()));
  }
  const span = Math.max(t1 - t0, 1);
  const order = ["drpc-phase", "drpc-progression", "vrg-dr1", "vrg-dr2", "s3", "invariants"];
  const rows = order.filter(k => tl[k]).map(track => {
    if (track === "invariants") {
      return `<div class="tlrow"><div class="tllabel">invariants</div><div class="tlband flags">` +
        tl[track].map(g => {
          const x = 100 * (Date.parse(g.start) - t0) / span;
          return `<span class="flag" style="left:${x}%" title="${esc(g.value)}">⚑</span>`;
        }).join("") + `</div></div>`;
    }
    return `<div class="tlrow"><div class="tllabel">${esc(track)}</div><div class="tlband">` +
      tl[track].map(g => {
        const a = Date.parse(g.start), b = Date.parse(g.end || new Date().toISOString());
        const w = 100 * (b - a) / span, x = 100 * (a - t0) / span;
        return `<div class="seg" style="left:${x}%;width:${w}%;background:${colorOf(g.value)}"
          title="${esc(g.value)}"><span>${esc(g.value)}</span></div>`;
      }).join("") + `</div></div>`;
  }).join("");
  // Sub-10s spans floor every axis label to the same value; show tenths.
  const durAxis = ms => span < 10000 ? `${(ms / 1000).toFixed(1)}s` : dur(ms);
  const axis = `<div class="axis">${[0, .25, .5, .75, 1]
    .map(f => `<span>${durAxis(span * f)}</span>`).join("")}</div>`;
  el.innerHTML = `<h4>STATE TIMELINE · ${esc(id)}</h4>` + rows + axis;
}

// Actor lines look like "2026-…T13:32:07.013-04:00 work@dr2 applied …";
// show a short clock, color the actor, and let violations shout.
function fmtEvent(e) {
  const raw = (e.data && (e.data.line || e.data.violation)) || e.type;
  if (e.type === "invariant_violated") return `<span class="t">${short(e.at)}</span> <span class="viol">⚑ ${esc(raw)}</span>`;
  const m = raw.match(/^(\S+)\s+(\S+@\S+|matrix:)\s+([\s\S]*)$/);
  if (m) return `<span class="t">${short(m[1])}</span> <span class="actor">${esc(m[2])}</span> ${esc(m[3])}`;
  return `<span class="t">${short(e.at)}</span> ${esc(raw)}`;
}

// Traffic animation: each NEW actor event since the last render spawns a
// dot that travels the matching edge (work: hub->cluster apply, view:
// cluster->hub status, volrep: along the replication arrow) and flashes
// that actor's glyph. The seq watermark keeps re-renders and reloads from
// replaying history as traffic.
const DOTCOLORS = { work: "#58a6ff", view: "#a371f7", volrep: "#2ea043" };

// A hard concurrency cap keeps busy phases readable: traffic is an
// impression, not an event log — the events column is the log.
const MAXDOTS = 10;

function spawnDot(from, to, color) {
  const stage = document.getElementById("stage");
  if (stage.querySelectorAll(".dot2").length >= MAXDOTS) return;
  const d = document.createElement("div");
  d.className = "dot2";
  d.style.background = color;
  d.style.boxShadow = `0 0 8px ${color}`;
  d.style.left = `${from.x - 4}px`;
  d.style.top = `${from.y - 4}px`;
  stage.appendChild(d);
  d.animate(
    [{ left: `${from.x - 4}px`, top: `${from.y - 4}px` },
     { left: `${to.x - 4}px`, top: `${to.y - 4}px` }],
    { duration: 650, easing: "ease-in-out" },
  ).onfinish = () => d.remove();
  setTimeout(() => d.remove(), 1200); // backstop: onfinish can be skipped
}

function flashGlyph(actor, cluster) {
  const g = document.getElementById(`g-${actor}-${cluster}`);
  if (!g) return;
  g.classList.add("on");
  setTimeout(() => g.classList.remove("on"), 450);
}

function animateTraffic(s) {
  if (S.animSeq === undefined) { // first snapshot: don't replay history
    S.animSeq = s.seq || 0;
    return;
  }

  const pts = stagePoints();
  let spawned = 0;

  for (const e of (s.events || [])) {
    if (e.seq <= S.animSeq || e.type !== "actor_event") continue;
    const m = ((e.data && e.data.line) || "").match(/^\S+\s+(\w+)@(\w+)\s/);
    if (!m) continue;
    const [, actor, cluster] = m;
    flashGlyph(actor, cluster);
    if (spawned >= 4 || !pts[cluster]) continue; // cap a burst, skip unknowns
    if (actor === "work") { spawnDot(pts.hub, pts[cluster], DOTCOLORS.work); spawned++; }
    else if (actor === "view") { spawnDot(pts[cluster], pts.hub, DOTCOLORS.view); spawned++; }
    else if (actor === "volrep") {
      const other = cluster === "dr1" ? "dr2" : "dr1";
      spawnDot(pts[other], pts[cluster], DOTCOLORS.volrep); spawned++;
    }
  }

  S.animSeq = Math.max(S.animSeq, s.seq || 0);
}

function renderEvents(s) {
  const el = document.getElementById("events");
  keepScroll(el, () => {
    el.innerHTML = (s.events || []).slice(-250).reverse()
      .map(e => `<div title="${esc((e.data && (e.data.line || e.data.violation)) || e.type)}">${fmtEvent(e)}</div>`).join("");
  });
}

refetch();
connect();
window.addEventListener("resize", () => { if (S.snap) drawEdges(); });
</script>
</body>
</html>
