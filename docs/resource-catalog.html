  header {

    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
  }
  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    margin: 16px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar h3:first-child { margin-top: 0; }
  .filter-group label {

    gap: 6px;
    padding: 3px 0;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .filter-group label:hover { color: var(--accent); }
  .filter-group input[type="checkbox"] {

    width: 14px;
    height: 14px;
  }
  .filter-count {

    font-size: 11px;

    min-width: 20px;
    text-align: center;
  }
  .main {

    padding: 20px 24px;
    overflow-x: auto;
  }
  .stats {

    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat-card {

    border-radius: 8px;
    padding: 12px 16px;
    min-width: 120px;
    text-align: center;

    font-weight: 700;
    color: var(--accent);
  }
  .stat-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);

    color: var(--text-secondary);

    border-radius: 12px;
    white-space: nowrap;

  .cat-ramen-crd { background: #f3e5f5; color: #7b1fa2; }
  .cat-volsync { background: #e8f5e9; color: #2e7d32; }
  .cat-csi-replication { background: #fff3e0; color: #e65100; }

  .cat-velero { background: #e0f2f1; color: #00695c; }
  .cat-core-kubernetes { background: #f5f5f5; color: #424242; }

  .cat-cephfs-consistency-group { background: #fce4ec; color: #880e4f; }

  .notes { max-width: 250px; font-size: 12px; color: var(--text-secondary); }

true, "transitiveSource": "VolumeReplication", "scope": "namespaced", "notes": "The CSI replication sidecar processes VolumeReplication CRs and configures storage backend replication", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}, {"name": "VolumeGroupSnapshot-created VolumeSnapshots", "kind": "VolumeSnapshot", "apiGroup": "snapshot.storage.k8s.io", "apiVersion": "v1", "creator": "CSI Snapshot Controller", "operatorMode": "dr-cluster", "clusterLocation": "managed-cluster", "category": "Snapshot", "purpose": "Individual VolumeSnapshots created by the snapshot controller when a VolumeGroupSnapshot is processed", "sourceFile": "", "creationMethod": "Transitive (snapshot controller)", "isTransitive": true, "transitiveSource": "VolumeGroupSnapshot", "scope": "namespaced", "notes": "One VolumeSnapshot per PVC in the group. Created by the CSI group snapshot controller.", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}, {"name": "VolumeSnapshotContent", "kind": "VolumeSnapshotContent", "apiGroup": "snapshot.storage.k8s.io", "apiVersion": "v1", "creator": "CSI Snapshot Controller", "operatorMode": "dr-cluster", "clusterLocation": "managed-cluster", "category": "Snapshot", "purpose": "Backing storage-level snapshot content created when a VolumeSnapshot is provisioned", "sourceFile": "", "creationMethod": "Transitive (snapshot controller)", "isTransitive": true, "transitiveSource": "VolumeSnapshot", "scope": "cluster", "notes": "Cluster-scoped resource binding a VolumeSnapshot to actual storage snapshot", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}, {"name": "VolumeGroupSnapshotContent", "kind": "VolumeGroupSnapshotContent", "apiGroup": "groupsnapshot.storage.k8s.io", "apiVersion": "v1beta1", "creator": "CSI Snapshot Controller", "operatorMode": "dr-cluster", "clusterLocation": "managed-cluster", "category": "Snapshot", "purpose": "Backing storage-level group snapshot content created when a VolumeGroupSnapshot is provisioned", "sourceFile": "", "creationMethod": "Transitive (snapshot controller)", "isTransitive": true, "transitiveSource": "VolumeGroupSnapshot", "scope": "cluster", "notes": "Cluster-scoped resource binding a VolumeGroupSnapshot to actual storage group snapshot", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}, {"name": "OLM-created Deployment (dr-cluster operator)", "kind": "Deployment", "apiGroup": "apps", "apiVersion": "v1", "creator": "OLM", "operatorMode": "hub", "clusterLocation": "managed-cluster", "category": "OLM", "purpose": "OLM creates the dr-cluster operator Deployment after processing the Subscription", "sourceFile": "", "creationMethod": "Transitive (OLM)", "isTransitive": true, "transitiveSource": "Subscription", "scope": "namespaced", "notes": "Only when DeploymentAutomationEnabled. OLM installs the CSV and creates the operator Deployment.", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}, {"name": "OLM-created ClusterServiceVersion", "kind": "ClusterServiceVersion", "apiGroup": "operators.coreos.com", "apiVersion": "v1alpha1", "creator": "OLM", "operatorMode": "hub", "clusterLocation": "managed-cluster", "category": "OLM", "purpose": "OLM creates CSV representing the installed dr-cluster operator version", "sourceFile": "", "creationMethod": "Transitive (OLM)", "isTransitive": true, "transitiveSource": "Subscription", "scope": "namespaced", "notes": "Only when DeploymentAutomationEnabled.", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}, {"name": "OLM-created InstallPlan", "kind": "InstallPlan", "apiGroup": "operators.coreos.com", "apiVersion": "v1alpha1", "creator": "OLM", "operatorMode": "hub", "clusterLocation": "managed-cluster", "category": "OLM", "purpose": "OLM creates InstallPlan to track dr-cluster operator installation steps", "sourceFile": "", "creationMethod": "Transitive (OLM)", "isTransitive": true, "transitiveSource": "Subscription", "scope": "namespaced", "notes": "Only when DeploymentAutomationEnabled.", "labelStatus": {"createdByRamen": "no-api", "ramenBackupExclusion": "n/a", "veleroExclusion": "no-api"}}]};

const COLUMNS = [
  { key: "name", label: "Resource", width: "180px" },
  { key: "kind", label: "Kind", width: "140px" },
  { key: "category", label: "Category", width: "120px" },
  { key: "operatorMode", label: "Operator", width: "90px" },
  { key: "clusterLocation", label: "Cluster", width: "100px" },
  { key: "creator", label: "Creator", width: "160px" },
  { key: "isTransitive", label: "Type", width: "70px" },
  { key: "scope", label: "Scope", width: "80px" },
  { key: "label1", label: "Label 1", width: "100px" },
  { key: "label2", label: "Label 2", width: "80px" },
  { key: "label3", label: "Label 3", width: "100px" },
  { key: "purpose", label: "Purpose", width: "" },
];

const CATEGORY_CLASSES = {
  "OCM": "cat-ocm",
  "Ramen CRD": "cat-ramen-crd",
  "VolSync": "cat-volsync",
  "CSI Replication": "cat-csi-replication",
  "Snapshot": "cat-snapshot",
  "Velero": "cat-velero",
  "Core Kubernetes": "cat-core-kubernetes",
  "RBAC": "cat-rbac",
  "Multicluster Networking": "cat-multicluster-networking",
  "CephFS Consistency Group": "cat-cephfs-consistency-group",
  "OLM": "cat-olm",
  "CSI Addons": "cat-csi-addons",
};

let resources = DATA.resources;
let filters = {};
let sortCol = "name";
let sortDir = 1;
let searchQuery = "";

function unique(arr, key) {
  const vals = new Set();
  arr.forEach(r => {
    const v = typeof r[key] === "boolean" ? (r[key] ? "Transitive" : "Direct") : r[key];
    if (v) vals.add(v);
  });
  return [...vals].sort();
}

const FILTER_DEFS = [
  { key: "operatorMode", title: "Operator Mode", values: unique(resources, "operatorMode") },
  { key: "clusterLocation", title: "Cluster Location", values: unique(resources, "clusterLocation") },
  { key: "category", title: "Category", values: unique(resources, "category") },
  { key: "creator", title: "Creator", values: unique(resources, "creator") },
  { key: "isTransitive", title: "Direct / Transitive", values: ["Direct", "Transitive"] },
  { key: "scope", title: "Scope", values: unique(resources, "scope") },
  { key: "createdByRamen", title: "Label 1 (Created by Ramen)", values: ["yes", "no", "moverPodLabels", "no-api"] },
  { key: "veleroExclusion", title: "Label 3 (Velero Exclusion)", values: ["yes", "no", "moverPodLabels", "no-api"] },
];

function initFilters() {
  FILTER_DEFS.forEach(fd => { filters[fd.key] = new Set(); });
}

function getFilterVal(r, key) {
  if (key === "isTransitive") return r.isTransitive ? "Transitive" : "Direct";
  if (key === "createdByRamen") return r.labelStatus.createdByRamen;
  if (key === "veleroExclusion") return r.labelStatus.veleroExclusion;
  return r[key];
}

function matchesFilters(r) {
  for (const fd of FILTER_DEFS) {
    if (filters[fd.key].size === 0) continue;
    const val = getFilterVal(r, fd.key);
    if (!filters[fd.key].has(val)) return false;
  }
  return true;
}

function matchesSearch(r) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return (
    r.name.toLowerCase().includes(q) ||
    r.kind.toLowerCase().includes(q) ||
    r.apiGroup.toLowerCase().includes(q) ||
    r.purpose.toLowerCase().includes(q) ||
    r.creator.toLowerCase().includes(q) ||
    r.category.toLowerCase().includes(q) ||
    r.creationMethod.toLowerCase().includes(q) ||
    (r.notes && r.notes.toLowerCase().includes(q)) ||
    (r.sourceFile && r.sourceFile.toLowerCase().includes(q)) ||
    (r.transitiveSource && r.transitiveSource.toLowerCase().includes(q))
  );
}

function getFiltered() {
  return resources.filter(r => matchesFilters(r) && matchesSearch(r));
}

function getSortVal(r, col) {
  if (col === "label1") return r.labelStatus.createdByRamen;
  if (col === "label2") return r.labelStatus.ramenBackupExclusion;
  if (col === "label3") return r.labelStatus.veleroExclusion;
  return r[col];
}

function sortResources(arr) {
  return [...arr].sort((a, b) => {
    let va = getSortVal(a, sortCol), vb = getSortVal(b, sortCol);
    if (typeof va === "boolean") { va = va ? 1 : 0; vb = vb ? 1 : 0; }
    if (typeof va === "string") { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return -sortDir;
    if (va > vb) return sortDir;
    return 0;
  });
}

function renderSidebar() {
  const filtered = getFiltered();
  let html = "";
  FILTER_DEFS.forEach(fd => {
    html += `<h3>${fd.title}</h3><div class="filter-group">`;
    fd.values.forEach(v => {
      const count = filtered.filter(r => getFilterVal(r, fd.key) === v).length;
      const checked = filters[fd.key].has(v) ? "checked" : "";
      html += `<label><input type="checkbox" data-filter="${fd.key}" data-value="${v}" ${checked}><span>${v}</span><span class="filter-count">${count}</span></label>`;
    });
    html += "</div>";
  });
  html += `<button class="clear-filters" onclick="clearFilters()">Clear All Filters</button>`;
  document.getElementById("sidebar").innerHTML = html;
  document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", function() {
      const key = this.dataset.filter;
      const val = this.dataset.value;
      if (this.checked) filters[key].add(val);
      else filters[key].delete(val);
      render();
    });
  });
}

function renderStats() {
  const filtered = getFiltered();
  const direct = filtered.filter(r => !r.isTransitive).length;
  const transitive = filtered.filter(r => r.isTransitive).length;
  const hubOnly = filtered.filter(r => r.operatorMode === "hub").length;
  const drOnly = filtered.filter(r => r.operatorMode === "dr-cluster").length;
  const label1Yes = filtered.filter(r => r.labelStatus.createdByRamen === "yes").length;
  const label1Mover = filtered.filter(r => r.labelStatus.createdByRamen === "moverPodLabels").length;
  const label3Yes = filtered.filter(r => r.labelStatus.veleroExclusion === "yes").length;
  const label3Mover = filtered.filter(r => r.labelStatus.veleroExclusion === "moverPodLabels").length;

  document.getElementById("stats").innerHTML = `
    <div class="stat-card"><div class="number">${filtered.length}</div><div class="label">Total Resources</div></div>
    <div class="stat-card"><div class="number">${direct}</div><div class="label">Direct</div></div>
    <div class="stat-card"><div class="number">${transitive}</div><div class="label">Transitive</div></div>
    <div class="stat-card"><div class="number">${hubOnly}</div><div class="label">Hub Operator</div></div>
    <div class="stat-card"><div class="number">${drOnly}</div><div class="label">DR-Cluster</div></div>
    <div class="stat-card"><div class="number">${label1Yes}+${label1Mover}</div><div class="label">Label 1 Covered</div></div>
    <div class="stat-card"><div class="number">${label3Yes}+${label3Mover}</div><div class="label">Label 3 Covered</div></div>
  `;
}

function modeTag(mode) {
  if (mode === "hub") return `<span class="tag tag-hub">hub</span>`;
  if (mode === "dr-cluster") return `<span class="tag tag-dr-cluster">dr-cluster</span>`;
  return `<span class="tag tag-both">both</span>`;
}

function clusterTag(loc) {
  if (loc === "hub") return `<span class="tag tag-hub">hub</span>`;
  if (loc === "managed-cluster") return `<span class="tag tag-dr-cluster">managed</span>`;
  return `<span class="tag tag-both">both</span>`;
}

function categoryTag(cat) {
  const cls = CATEGORY_CLASSES[cat] || "cat-core-kubernetes";
  return `<span class="category-tag ${cls}">${cat}</span>`;
}

function labelBadge(val) {
  const clsMap = { "yes": "label-yes", "no": "label-no", "moverPodLabels": "label-moverPodLabels", "no-api": "label-no-api", "implicit": "label-implicit", "n/a": "label-na" };
  const cls = clsMap[val] || "label-na";
  return `<span class="label-badge ${cls}">${val}</span>`;
}

function renderTable() {
  const filtered = sortResources(getFiltered());
  document.getElementById("results-info").textContent = `Showing ${filtered.length} of ${resources.length} resources`;

  let thead = "<tr>";
  COLUMNS.forEach(col => {
    const arrow = sortCol === col.key ? (sortDir === 1 ? "▲" : "▼") : "▲";
    const cls = sortCol === col.key ? "sorted" : "";
    thead += `<th class="${cls}" data-col="${col.key}" style="${col.width ? 'width:' + col.width : ''}">${col.label} <span class="sort-arrow">${arrow}</span></th>`;
  });
  thead += `<th style="width:40px"></th></tr>`;
  document.getElementById("thead").innerHTML = thead;

  let tbody = "";
  filtered.forEach((r, i) => {
    tbody += `<tr>`;
    COLUMNS.forEach(col => {
      let val = r[col.key];
      if (col.key === "operatorMode") val = modeTag(val);
      else if (col.key === "clusterLocation") val = clusterTag(val);
      else if (col.key === "category") val = categoryTag(val);
      else if (col.key === "isTransitive") val = val ? `<span class="tag tag-transitive">transitive</span>` : `<span class="tag tag-direct">direct</span>`;
      else if (col.key === "scope") val = val === "cluster" ? `<span class="tag tag-cluster">cluster</span>` : `<span class="tag tag-namespaced">namespaced</span>`;
      else if (col.key === "label1") val = labelBadge(r.labelStatus.createdByRamen);
      else if (col.key === "label2") val = labelBadge(r.labelStatus.ramenBackupExclusion);
      else if (col.key === "label3") val = labelBadge(r.labelStatus.veleroExclusion);
      else if (col.key === "purpose") val = `<span class="purpose">${val}</span>`;
      else val = val || "";
      tbody += `<td>${val}</td>`;
    });
    tbody += `<td><button class="expand-btn" data-idx="${i}" title="Details">▼</button></td>`;
    tbody += `</tr>`;
    tbody += `<tr class="detail-row" id="detail-${i}"><td colspan="${COLUMNS.length + 1}">
      <div class="detail-grid">
        <span class="detail-label">API Group</span><span>${r.apiGroup || "(core)"}</span>
        <span class="detail-label">API Version</span><span>${r.apiVersion || ""}</span>
        <span class="detail-label">Creation Method</span><span>${r.creationMethod || ""}</span>
        <span class="detail-label">Source File</span><span class="source-file">${r.sourceFile || ""}</span>
        ${r.isTransitive ? `<span class="detail-label">Triggered By</span><span>${r.transitiveSource}</span>` : ""}
        <span class="detail-label">Label 1 (Created by Ramen)</span><span>${labelBadge(r.labelStatus.createdByRamen)}</span>
        <span class="detail-label">Label 2 (Backup Exclusion)</span><span>${labelBadge(r.labelStatus.ramenBackupExclusion)}</span>
        <span class="detail-label">Label 3 (Velero Exclusion)</span><span>${labelBadge(r.labelStatus.veleroExclusion)}</span>
        ${r.notes ? `<span class="detail-label">Notes</span><span class="notes">${r.notes}</span>` : ""}
      </div>
    </td></tr>`;
  });
  document.getElementById("tbody").innerHTML = tbody;

  document.querySelectorAll("th[data-col]").forEach(th => {
    th.addEventListener("click", function() {
      const col = this.dataset.col;
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = 1; }
      render();
    });
  });

  document.querySelectorAll(".expand-btn").forEach(btn => {
    btn.addEventListener("click", function() {
      const row = document.getElementById("detail-" + this.dataset.idx);
      row.classList.toggle("open");
      this.textContent = row.classList.contains("open") ? "▲" : "▼";
    });
  });
}

function clearFilters() {
  initFilters();
  searchQuery = "";
  document.getElementById("search").value = "";
  render();
}

function render() {
  renderSidebar();
  renderStats();
  renderTable();
}

document.getElementById("search").addEventListener("input", function() {
  searchQuery = this.value;
  render();
});

initFilters();
render();
</script>

</body>
</html>
